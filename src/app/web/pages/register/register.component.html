<div class="login-container">
  <!-- Decorative Glow Blobs -->
  <div class="glow-blob glow-blob--top"></div>
  <div class="glow-blob glow-blob--bottom"></div>

  <!-- Main Register Card -->
  <div class="login-card">
    <!-- Brand Header -->
    <div class="brand-header">
      <div class="brand-icon-box">
        <i class="pi pi-user-plus"></i>
      </div>
      <h1 class="brand-title">Create Account</h1>
      <p class="brand-subtitle">Join Torque — Repair Shop Management</p>
    </div>

    <div class="divider"></div>

    <!-- Register Form -->
    <form class="login-form" (ngSubmit)="onRegister()">
      <!-- Username Field -->
      <div class="form-group">
        <div class="input-wrapper">
          <i class="pi pi-user input-icon"></i>
          <input 
            type="text" 
            class="login-input" 
            [(ngModel)]="username" 
            name="username"
            placeholder="Username" 
            autocomplete="username"
            required />
        </div>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <div class="input-wrapper">
          <i class="pi pi-lock input-icon"></i>
          <input 
            [type]="showPassword ? 'text' : 'password'" 
            class="login-input" 
            [(ngModel)]="password" 
            name="password"
            placeholder="Password" 
            autocomplete="new-password"
            required />
          <button type="button" class="password-toggle" (click)="togglePassword()">
            <i [class]="showPassword ? 'pi pi-eye-slash' : 'pi pi-eye'"></i>
          </button>
        </div>
      </div>

      <!-- Role Selection Field -->
      <div class="form-group">
        <div class="input-wrapper">
          <i class="pi pi-shield input-icon"></i>
          <select 
            class="login-input select-input" 
            [(ngModel)]="roleId" 
            name="roleId"
            required>
            <option *ngFor="let r of roles" [value]="r.id">{{ r.name }} - {{ r.description }}</option>
          </select>
          <i class="pi pi-chevron-down select-chevron"></i>
        </div>
      </div>

      <!-- Branch Location Field -->
      <div class="form-group">
        <div class="input-wrapper">
          <i class="pi pi-map-marker input-icon"></i>
          <input 
            type="text" 
            class="login-input" 
            [(ngModel)]="branchLocation" 
            name="branchLocation"
            placeholder="Branch Location (e.g. Colombo)" 
            required />
        </div>
      </div>

      <!-- Error Message -->
      <div class="error-message" *ngIf="errorMessage">
        <i class="pi pi-exclamation-circle"></i>
        <span>{{ errorMessage }}</span>
      </div>

      <!-- Sign Up Button -->
      <button type="submit" class="btn-signin" [disabled]="loading">
        <span *ngIf="!loading">Create Account</span>
        <i *ngIf="!loading" class="pi pi-arrow-right"></i>
        <i *ngIf="loading" class="pi pi-spin pi-spinner"></i>
      </button>
    </form>

    <!-- Sign In Prompt -->
    <div class="signup-prompt">
      <span>Already have an account?</span>
      <a routerLink="/login" class="signup-link">Sign in</a>
    </div>

    <!-- Secure Connection Footer -->
    <div class="secure-footer">
      <i class="pi pi-shield"></i>
      <span>Secured & encrypted connection</span>
    </div>
  </div>
</div>
